<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro - RelateSBC</title>
    <link rel="stylesheet" href="../estilo/geral.css">
    <link rel="stylesheet" href="../estilo/cadastro.css">
    <link rel="stylesheet" href="../../recursos/fontawesone/css/all.css">
</head>

<body>

    <header class="auth-header">
        <a href="index.html" class="btn-back" aria-label="Voltar para a página inicial">
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
            <span>Voltar ao início</span>
        </a>
    </header>

    <main class="page-split-container">
        
        <!-- SEÇÃO ESQUERDA: APRESENTAÇÃO -->
        <section class="brand-info">
            <h1 class="brand-title">Ajude a melhorar nossa cidade.</h1>
            <p class="brand-description">
                Cadastre-se no RelateSBC para acompanhar suas denúncias e fazer a diferença na sua cidade.
            </p>
            <div class="brand-illustration">
                <i class="fa-solid fa-tree"></i>
            </div>
        </section>

        <!-- SEÇÃO DIREITA: FORMULÁRIO COM TODOS OS CAMPOS -->
        <section class="form-container">
            <div class="form-header">
                <h2>Cadastro</h2>
                <a href="login.html" class="login-link">Já tem conta?</a>
            </div>

            <form id="form-cadastro-denunciante">
                <div class="fields-group">
                    <label class="form-field">
                        <span>Nome</span>
                        <input type="text" name="nome" placeholder="Seu nome" required>
                        <i class="fa-solid fa-user" aria-hidden="true"></i>
                    </label>

                    <label class="form-field">
                        <span>Sobrenome</span>
                        <input type="text" name="sobrenome" placeholder="Seu sobrenome" required>
                        <i class="fa-solid fa-user" aria-hidden="true"></i>
                    </label>

                    <label class="form-field">
                        <span>E-mail</span>
                        <input type="email" name="email" placeholder="exemplo@gmail.com" required>
                        <i class="fa-regular fa-envelope" aria-hidden="true"></i>
                    </label>

                    <label class="form-field">
                        <span>CPF</span>
                        <input type="text" name="cpf" placeholder="000.000.000-00" required>
                        <i class="fa-solid fa-id-card" aria-hidden="true"></i>
                    </label>

                    <label class="form-field">
                        <span>Senha</span>
                        <input type="password" name="senha" placeholder="Sua senha" minlength="8" required>
                        <i class="fa-solid fa-eye-slash" aria-hidden="true"></i>
                    </label>

                    <label class="form-field">
                        <span>Confirmar Senha</span>
                        <input type="password" name="confirmar-senha" placeholder="Confirme a senha" minlength="8" required>
                        <i class="fa-solid fa-eye-slash" aria-hidden="true"></i>
                    </label>
                </div>

                <button type="submit" class="submit-btn">
                    <span>Criar conta</span>
                    <i class="fa-solid fa-check" aria-hidden="true"></i>
                </button>
            </form>
        </section>

    </main>

    <script src="../app/view/scripts/cadastro-denunciante.js"></script>
</body>
</html>
