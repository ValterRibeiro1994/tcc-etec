<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="app/view/estilo/geral.css">
    <link rel="stylesheet" href="app/view/estilo/cadastro.css">
    <link rel="stylesheet" href="app/recursos/fontawesone/css/all.css">
    <link rel="stylesheet" href="app/recursos/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <title>Cadastro - RelateSBC</title>
</head>

<body> 

    <header class="auth-header">

        <header>
        <!-- 
            navbar: Define o componente de barra de navegação
            navbar-expand-lg: Expande a barra (links visíveis) em telas grandes (>=992px) e recolhe em telas menores
            navbar-dark: Ajusta o contraste do texto e ícones para fundos escuros
            bg-dark: Aplica cor de fundo escura (tema dark)
        -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

            <!-- container-fluid: Contêiner de largura total (100% da viewport) -->
            <div class="container-fluid">

                <!-- navbar-brand: Estilização reservada para marca/logo -->
                <a href="#" class="navbar-brand">
                    <!-- 
                        img-fluid: Torna a imagem responsiva (max-width: 100%; height: auto)
                        rounded-3: Aplica bordas arredondadas médias
                    -->
                    <img src="app/recursos/imagens/logo-site-pequeno.png" alt="Logo do site" class="img-fluid rounded-3">
                </a>

                <!-- 
                    navbar-toggler: Botão "hambúrguer" exibido apenas em telas menores
                -->
                <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menuNavegacao" aria-controls="menuNavegacao" aria-expanded="false" aria-label="Abrir menu">
                    <!-- navbar-toggler-icon: Ícone do botão hambúrguer -->
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- 
                    collapse: Esconde o conteúdo por padrão em telas pequenas
                    navbar-collapse: Agrupa o conteúdo que será expandido/recolhido
                -->
                <div class="collapse navbar-collapse" id="menuNavegacao">

                    <!-- 
                        navbar-nav: Organiza os itens da lista de navegação
                        me-auto: Margem direita automática (empurra os elementos seguintes para a direita)
                        mb-3: Margem inferior de nível 3 (0.75rem em telas pequenas)
                        mb-lg-0: Remove a margem inferior em telas grandes (>=992px)
                    -->
                    <ul class="navbar-nav me-auto mb-3 mb-lg-0">

                        <!-- nav-item: Item individual da lista de navegação -->
                        <li class="nav-item">
                            <!-- 
                                nav-link: Estilização do link da barra de navegação
                                fs-5: Tamanho da fonte nível 5 (1.25rem)
                                text-white: Define a cor do texto como branco
                            -->
                            <a href="#" class="nav-link fs-5 text-white">Início</a>
                        </li>

                        <li class="nav-item">
                            <a href="#" class="nav-link fs-5 text-white">Sobre</a>
                        </li>

                        <li class="nav-item">
                            <a href="#" class="nav-link fs-5 text-white">Denúncias</a>
                        </li>

                     

                    </ul>

                    <!-- 
                        d-flex: Define display flexbox no elemento
                        gap-2: Espaçamento de nível 2 (0.5rem) entre os itens filhos
                    -->
                   
                        <!-- 
                            btn: Estilização base para botões
                            btn-success: Estilo do botão na cor verde (sucesso/confirmação)
                            text-nowrap: Impede que o texto do botão quebre em múltiplas linhas
                        -->
                        <button type="submit" class="btn btn-success text-nowrap">
                            Conectar
                        </button>

                    </form>

                </div>

            </div>

        </nav>

    </header>
    <a href="../home" class="btn-back" aria-label="Voltar para a página inicial">
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
            <span>Voltar ao início</span>
        </a>
    </header>
       

    <main class="page-split-container">
        
        <!-- SEÇÃO ESQUERDA: APRESENTAÇÃO -->
        <section class="brand-info">
            <h1 class="brand-title">Ajude a melhorar nossa cidade.</h1>
            <p class="brand-description">
                Cadastre-se no RelateSBC para acompanhar as denúncias dos usuários e fazer a diferença na sua cidade.
            </p>
            <div class="brand-illustration">
                <i class="fa-solid fa-tree"></i>
            </div>
        </section>

        <!-- SEÇÃO DIREITA: FORMULÁRIO COM TODOS OS CAMPOS -->
        <section class="form-container">
            <div class="form-header">
                <h2>Cadastro de Representante</h2>
                <a href="login" class="login-link">Já tem conta?</a>
            </div>

            <form id="form-cadastro-representante"><!--Nome estava errado-->
                <div class="fields-group">
                    <label class="form-field">
                        <span>Nome</span>
                        <input type="text" value="teste" name="nome" placeholder="Seu nome" required>
                        <i class="fa-solid fa-user" aria-hidden="true"></i>
                    </label>

                    <label class="form-field">
                        <span>Sobrenome</span>
                        <input type="text" value="treste" name="sobrenome" placeholder="Seu sobrenome" required>
                        <i class="fa-solid fa-user" aria-hidden="true"></i>
                    </label>

                    <label class="form-field">
                        <span>E-mail</span>
                        <input type="email" value="teste@email.com" name="email" placeholder="exemplo@gmail.com" required>
                        <i class="fa-regular fa-envelope" aria-hidden="true"></i>
                    </label>

                    <label class="form-field">
                        <span>CPF</span>
                        <input type="text" value="12345678978" name="cpf" placeholder="000.000.000-00" required>
                        <i class="fa-solid fa-id-card" aria-hidden="true"></i>
                    </label>

                    <label class="form-field">
                        <span>Matricula</span>
                        <input type="text" value="123456" name="matricula" placeholder="000.000" required>
                        <i class="fa-solid fa-id-card" aria-hidden="true"></i>
                    </label>

                    <label class="form-field">
                        <span>Cargo</span>
                        <input type="text" value="Adiministrador" name="cargo" placeholder="Adiministrador" required>
                        <i class="fa-solid fa-id-card" aria-hidden="true"></i>
                    </label>


                    <label class="form-field">
                        <span>Senha</span>
                        <input type="password" value="asdasdasd" name="senha" placeholder="Sua senha" minlength="8" required>
                        <i class="fa-solid fa-eye-slash" aria-hidden="true"></i>
                    </label>

                    <label class="form-field">
                        <span>Confirmar Senha</span>
                        <input type="password" value="asdasdasd" name="confirmar-senha" placeholder="Confirme a senha" minlength="8" required>
                        <i class="fa-solid fa-eye-slash" aria-hidden="true"></i>
                    </label>
                </div>
                <p id="respostaProcesso"></p>

                <button type="submit" class="submit-btn">
                    <span>Criar conta</span>
                    <i class="fa-solid fa-check" aria-hidden="true"></i>
                </button>
            </form>
        </section>

    </main>

    <script src="../app/view/scripts/cadastro-denunciante.js"></script>
</body>
</html>
