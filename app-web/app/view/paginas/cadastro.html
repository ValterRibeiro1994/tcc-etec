<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link rel="stylesheet" href="../estilo/geral.css">
    <link rel="stylesheet" href="../estilo/cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>

<main class="form-container">
    <header class="form-header">
        <h1>Cadastre-se</h1>
        <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
    </header>

    <form id="cadastro-form">
        <div class="fields-group">
            <label class="form-field">
                <span>Primeiro Nome</span>
                <input type="text" name="name" placeholder="Nome" required>
                <i class="fa-solid fa-user" aria-hidden="true"></i>
            </label>
            
            <label class="form-field">
                <span>Último Nome</span>
                <input type="text" name="last-name" placeholder="Sobrenome" required>
                <i class="fa-solid fa-user" aria-hidden="true"></i>
            </label>

            <label class="form-field">
                <span>Nascimento</span>
                <input type="date" name="birthdate">
            </label>

            <label class="form-field">
                <span>E-mail</span>
                <input type="email" name="email" placeholder="exemplo@gmail.com" required>
                <i class="fa-regular fa-envelope" aria-hidden="true"></i>
            </label>

            <label class="form-field">
                <span>Senha</span>
                <input type="password" name="password" placeholder="******" minlength="8" required>
                <i class="fa-solid fa-eye-slash" aria-hidden="true"></i>
            </label>

            <label class="form-field">
                <span>Confirmar Senha</span>
                <input type="password" name="confirm-password" placeholder="******" minlength="8" required>
                <i class="fa-solid fa-eye-slash" aria-hidden="true"></i>
            </label>
        </div>

        <button type="submit" class="submit-btn">
            Criar conta
            <i class="fa-solid fa-check" aria-hidden="true"></i>
        </button>
    </form>
    <script src="../scripts/cadastro.js"></script>
</main>
</body>
</html>
